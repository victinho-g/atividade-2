<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Vagas - IFPI</title>
    <link rel="stylesheet" href="reserva.css">
</head>
<body>

    <header>
        <h1>Reserva de Vagas IFPI</h1>
        <p>Garanta sua vaga no refeitório!</p>
    </header>

    <main>
        <section class="painel">
            <h2>Vagas disponíveis</h2>
            <div class="contador">
                <span id="vagas">60</span>
                <p>Vagas restantes</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Dados do aluno</h2>

            <form id="formReserva">

                <label>Nome completo</label>
                <input type="text" id="nome"
                    placeholder="Digite seu nome" required>

                <label>Matrícula</label>
                <input type="text" id="matricula"
                    placeholder="Número da matrícula" required>

                <label>Turma</label>
                <input type="text" id="turma"
                    placeholder="Digite sua turma" required>

                <label>Dia da reserva</label>
                <select id="dia" required>
                    <option value="">Escolha o dia</option>
                    <option>Segunda-feira</option>
                    <option>Terça-feira</option>
                    <option>Quarta-feira</option>
                    <option>Quinta-feira</option>
                    <option>Sexta-feira</option>
                </select>

                <button type="submit">Reservar minha vaga</button>

            </form>

            <p id="mensagem"></p>
        </section>

        <section class="lista">
            <h2>Reservas realizadas</h2>
            <ul id="listaReservas"></ul>
        </section>

    </main>

    
    <script src="reservados.js"></script>
</body>
</html>
